name: warehouse
extends: factory
description: >
  Storage halls and distribution floors.  Racking creates tall, narrow aisles
  that a footprint-eroded reachability check will correctly refuse; that is the
  point, not a bug to tune away.  Mezzanine offices sit on one or two levels.
source_corpus: "warehouse / storage subset of a multi-type USD corpus"

stair:
  families: [straight, u_shaped]
  width_m: 1.20
  min_width_m: 1.00

storeys:
  min_storey_height_m: 3.50
  max_storey_height_m: 6.00
  min_storey_floor_area_m2: 80.0

acceptance:
  min_reachable_area_per_storey_m2: 40.0
